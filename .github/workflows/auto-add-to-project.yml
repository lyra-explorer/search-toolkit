name: Auto-add issue to project

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/na-navi/projects/2
          github-token: ${{ secrets.PROJECT_AUTO_ADD_PAT }}
